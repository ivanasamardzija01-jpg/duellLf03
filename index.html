<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LF03 Duell 4.1</title><style>:root{--g:#25d48a;--p:#8b5cf6;--k:#ec4899;--bg:#07111f;--t:#eef6ff;--m:#9fb0c5;--r:#ef4444}*{box-sizing:border-box}body{margin:0;min-height:100vh;font:16px Segoe UI,Arial;background:radial-gradient(circle at top,#1b3156,var(--bg) 58%);color:var(--t)}main{max-width:980px;margin:auto;padding:16px}header{text-align:center;padding:18px}h1{font-size:clamp(2rem,6vw,4rem);margin:.1em;background:linear-gradient(90deg,var(--g),var(--p),var(--k));-webkit-background-clip:text;color:transparent}.panel{background:#111f34f2;border:1px solid #304968;border-radius:24px;padding:24px}.hidden{display:none!important}.small{color:var(--m)}input,select{width:100%;padding:14px;border:1px solid #43617f;border-radius:12px;background:#081524;color:white;margin:5px 0 10px}.btn{border:0;border-radius:13px;padding:13px 19px;font-weight:900;cursor:pointer;margin:10px 6px 0 0}.pri{background:linear-gradient(90deg,var(--g),var(--p));color:#04101b}.sec{background:#29415e;color:white}.danger{background:#7f1d1d;color:white}.status{margin-top:14px;padding:13px;border-radius:12px;background:#0a1728}.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:16px 0}.player{background:#0a1728;border:2px solid #2d4664;border-radius:15px;padding:13px}.me{border-color:var(--p)}.done{border-color:var(--g)}.score{font-size:1.3rem;font-weight:900}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.topic{background:var(--g);color:#06111d;padding:6px 10px;border-radius:99px;font-weight:900}.progress{height:10px;background:#263d58;border-radius:99px;overflow:hidden;margin:15px 0}.bar{height:100%;background:linear-gradient(90deg,var(--g),var(--k))}.question{font-size:1.4rem;margin:20px 0}.options{display:grid;gap:10px}.option{padding:15px;text-align:left;border:1px solid #405b7b;bo "Ethernet"],["IPv4","verwendet für logische Adressen eine Länge von genau 32 Bit","IP"],["IPv6","verwendet für logische Adressen eine Länge von genau 128 Bit","IP"],["Subnetzmaske","kennzeichnet bei IPv4 die Trennung zwischen Netz- und Hostanteil","IP"],["Standardgateway","nimmt Pakete an, deren Ziel außerhalb des lokalen IP-Netzes liegt","IP"],["TTL","begrenzt durch Herunterzählen an Routern die Lebensdauer eines IP-Pakets","IP"],["ARP","ermittelt im lokalen IPv4-Netz die MAC-Adresse zu einer bekannten IP-Adresse","IP"],["Unicast","adressiert eine Übertragung von einem Absender an genau einen Empfänger","IP"],["Broadcast","adressiert eine Übertragung an alle Geräte einer Broadcast-Domäne","IP"],["NAT","ersetzt beim Netzübergang IP-Adressen durch andere IP-Adressen","IP"],["PAT","unterscheidet mehrere Adressübersetzungen zusätzlich anhand von Portnummern","IP"],["DHCP","liefert Clients automatisch IP-Adresse, Maske und weitere Netzparameter","Dienste"],["DORA","bezeichnet die DHCP-Abfolge Discover, Offer, Request und Acknowledge","Dienste"],["APIPA","vergibt bei fehlendem DHCP unter IPv4 eine Adresse aus 169.254.0.0/16","Dienste"],["DNS","ordnet einem lesbaren Host- oder Domainnamen eine IP-Adresse zu","Dienste"],["ipconfig /all","zeigt unter Windows ausführliche Parameter aller IP-Schnittstellen","Dienste"],["TCP","überträgt Daten verbindungsorientiert, geordnet und mit Bestätigungen","Dienste"],["UDP","überträgt Datagramme verbindungslos ohne Zustellbestätigung","Dienste"],["VLAN","teilt ein physisches Switch-Netz in getrennte logische Broadcast-Domänen","LAN"],["IEEE 802.1Q","fügt Ethernet-Frames Informationen zur VLAN-Zugehörigkeit hinzu","LAN"],["Access-Port","ordnet Endgeräteverkehr normalerweise genau einem VLAN ungetaggt zu","LAN"],["Trunk-Port","transportiert Verkehr mehrerer VLANs zwischen Netzwerkgeräten","LAN"],["PoE","liefert Daten und elektrische Leistung gemeinsam über das Ethernetkabel","LAN"],["WPA3","schützt WLAN-Kommunikation mit einem modernen Si const app=initializeApp(cfg),db=getDatabase(app),R=ref(db,'rooms/123456'),VER=6,AL=[2,3,4,6],STALE=45000;let key='',cid=crypto.randomUUID(),room=null,disc=null,hb=null,busy=false;const $=x=>document.getElementById(x),show=x=>['join','lobby','game','final'].forEach(v=>$(v).classList.toggle('hidden',v!==x)),esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])),slug=s=>s.trim().toLowerCase().replace(/[.#$\[\]/]/g,'-').replace(/\s+/g,'-').slice(0,40),mix=a=>{a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};function active(s,n=Date.now()){return Object.keys(s?.players||{}).filter(k=>Object.values(s.players[k].connections||{}).some(c=>n-Number(c.lastSeen||0)<STALE))}function clean(s,n=Date.now()){if(!s||s.version!==VER)return s;for(let[k,p]of Object.entries(s.players||{})){for(let[i,c]of Object.entries(p.connections||{}))if(n-Number(c.lastSeen||0)>=STALE)delete p.connections[i];if(!Object.keys(p.connections||{}).length)delete s.players[k]}let a=active(s,n);if(a.length&&a.filter(k=>s.players[k].host).length!==1){a.forEach(k=>s.players[k].host=false);a.sort((x,y)=>(s.players[x].joined||0)-(s.players[y].joined||0));s.players[a[0]].host=true}return s}
$('joinBtn').onclick=join;$('forceReset').onclick=$('reset').onclick=async()=>{if(confirm('Raum vollständig leeren?')){await remove(R);location.reload()}};$('leave').onclick=leave;$('start').onclick=start;$('next').onclick=next;$('again').onclick=lobby;async function join(){let name=$('name').value.trim(),max=+$('size').value;if(!name||!AL.includes(max))return;key=slug(name);let C=ref(db,`rooms/123456/players/${key}/connections/${cid}`);disc=onDisconnect(C);await disc.remove();let n=Date.now(),r=await runTransaction(R,s=>{if(!s||s.version!==VER)s={version:VER,status:'lobby',maxPlayers:max,players:{}};s=clean(s,n);let a=active(s,n),p=s.players[key];if(!p&&a.length>=s.maxPlayers)return;s.players[key]=p||{name,score:0,host:!a.length,joined:n,connections:{}};s.players[key].connections[cid]={lastSeen:n};return clean(s,n)});if(!r.committed){await disc.cancel();$('joinMsg').textContent='Raum voll.';return}hb=setInterval(()=>update(C,{lastSeen:serverTimestamp()}),10000)}async function tidy(){if(busy)return;busy=true;try{await runTransaction(R,s=>clean(s))}finally{busy=false}}setInterval(()=>key&&tidy(),12000);async function leave(){clearInterval(hb);if(disc)await disc.cancel();await remove(ref(db,`rooms/123456/players/${key}/connections/${cid}`));await tidy();key='';show('join')}function ak(){return active(room)}async function start(){let a=ak();if(!room.players[key]?.host||a.length!==+room.maxPlayers)return;let p={};a.forEach(k=>p[k]={...room.players[k],score:0});await update(R,{status:'playing',questions:mix(BANK).slice(0,20),current:0,answers:null,result:null,scored:false,participants:a,players:p})}async function answer(i){if(!room.answers?.[key])await set(ref(db,`rooms/123456/answers/${key}`),{choice:i,at:serverTimestamp()})}async function score(){if(busy||!room.players[key]?.host||room.scored)return;let ids=(room.participants||ak()).filter(k=>room.players[k]);if(ids.some(x=>!room.answers?.[x]))return;busy=true;try{await runTransaction(R,s=>{s=clean(s);if(s.scored)return s;let ids=(s.participants||active(s)).filter(k=>s.players[k]),q=s.questions[s.current],ok=ids.filter(x=>s.answers[x].choice===q.answer).sort((x,y)=>s.answers[x].at-s.answers[y].at),pts=[12,10,7,5,3,1],r={};ids.forEach(x=>r[x]={correct:false,points:0});ok.forEach((x,i)=>{r[x]={correct:true,points:pts[i],place:i+1};s.players[x].score=(s.players[x].score||0)+pts[i]});s.result=r;s.scored=true;return s})}finally{busy=false}}async function next(){if(!room.players[key]?.host||!room.scored)return;await update(R,room.current>=19?{status:'finished'}:{current:room.current+1,answers:null,result:null,scored:false})}async function lobby(){if(!room.players[key]?.host)return;await update(R,{status:'lobby',questions:null,answers:null,result:null,scored:false,participants:null})}function cards(ans=false){return ak().map(k=>{let p=room.players[k];return`<div class="player ${k===key?'me':''} ${ans&&room.answers?.[k]?'done':''}"><b>${esc(p.name)} ${p.host?'👑':''}</b><div class="score">${p.score||0} Punkte</div></div>`}).join('')}function render(){if(!room?.players?.[key]?.connections?.[cid])return show('join');let me=room.players[key],a=ak();if(room.status==='lobby'){show('lobby');$('lp').innerHTML=cards();$('ls').textContent=`${a.length}/${room.maxPlayers} Spieler`;$('start').classList.toggle('hidden',!me.host||a.length!==+room.maxPlayers);$('reset').classList.toggle('hidden',!me.host)}else if(room.status==='playing'){show('game');game();if(me.host)score()}else{show('final');let m=['🥇','🥈','🥉','4.','5.','6.'];$('ranking').innerHTML=a.map(k=>room.players[k]).sort((x,y)=>y.score-x.score).map((p,i)=>`<div class="rank">${m[i]} ${esc(p.name)} · ${p.score||0}</div>`).join('');$('again').classList.toggle('hidden',!me.host)}}function game(){let q=room.questions[room.current],mine=room.answers?.[key],res=room.result;$('topic').textContent=q.topic;$('counter').textContent=`Frage ${room.current+1} von 20`;$('bar').style.width=`${(room.current+1)*5}%`;$('question').textContent=q.q;$('gp').innerHTML=cards(true);$('opts').innerHTML=q.options.map((o,i)=>`<button class="option ${res?(i===q.answer?'correct':mine?.choice===i?'wrong':''):''}" ${mine?'disabled':''} data-i="${i}">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('');$('opts').querySelectorAll('button').forEach(b=>b.onclick=()=>answer(+b.dataset.i));let ids=(room.participants||ak()).filter(k=>room.players[k]);$('count').textContent=`${Object.keys(room.answers||{}).length}/${ids.length}`;$('msg').textContent=mine?'Antwort gespeichert.':'Wähle eine Antwort.';if(res){$('rr').classList.remove('hidden');$('rr').innerHTML=`<b>Richtig: ${esc(q.options[q.answer])}</b><br>${esc(q.explanation)}`}else $('rr').classList.add('hidden');$('next').classList.toggle('hidden',!room.players[key]?.host||!room.scored)}onValue(R,s=>{room=s.val();render()});</script></body></html>
