async function join(){let n=$("name").value.trim().slice(0,18);if(!n)return alert("Bitte Namen eingeben.");let res=await runTransaction(R,s=>{s=s&&typeof s==="object"?s:{};s.players=s.players||{};if(!s.players[pid]&&Object.keys(s.players).length>=3)return;let first=Object.keys(s.players).length===0;s.players[pid]={name:n,score:s.players[pid]?.score||0,online:true,host:s.players[pid]?.host||first};s.status=s.status||"lobby";return s});if(!res.committed){$("joinMsg").textContent="Raum voll. Host muss alte Spieler entfernen.";return}localStorage.setItem("lf03name",n);await onDisconnect(ref(db,`rooms/${ROOM}/players/${pid}/online`)).set(false)}

async function score(){if(scoring||!room.players[pid].host||room.scored)return;let ids=Object.keys(room.players),a=room.answers||{};if(ids.some(x=>!a[x]))return;scoring=true;await runTransaction(R,s=>{if(!s||s.scored)return s;let ids=Object.keys(s.players),q=s.questions[s.current],ok=ids.filter(x=>s.answers[x].choice===q.answer).sort((x,y)=>s.answers[x].at-s.answers[y].at),pts=[12,10,7],r={};ids.forEach(x=>r[x]={correct:false,points:0});ok.forEach((x,i)=>{r[x]={correct:true,points:pts[i],place:i+1};s.players[x].score=(s.players[x].score||0)+pts[i]});s.result=r;s.scored=true;return s});scoring=false}

function render(){if(!room?.players?.[pid])return show("join");let me=room.players[pid];if(room.status==="lobby"){show("lobby");$("lp").innerHTML=phtml();let n=Object.keys(room.players).length;$("ls").textContent=`${n}/3 Spieler. ${n===3?'Bereit!':'Warte auf Mitspieler …'}`;$("start").classList.toggle("hidden",!me.host||n!==3);$("reset").classList.toggle("hidden",!me.host)}else if(room.status==="playing"){show("game");renderGame();if(me.host)score()}else{show("final");let a=Object.values(room.players).sort((x,y)=>y.score-x.score),m=["🥇","🥈","🥉"];$("ranking").innerHTML=a.map((p,i)=>`<div class="rank">${m[i]} <b>${esc(p.name)}</b> · ${p.score} Punkte</div>`).join("");$("again").classList.toggle("hidden",!me.host)}}
function renderGame(){let q=room.questions[room.current],mine=room.answers?.[pid],res=room.result;$("topic").textContent=q.topic;$("counter").textContent=`Frage ${room.current+1} von 20`;$("bar").style.width=`${(room.current+1)*5}%`;$("question").textContent=q.q;$("gp").innerHTML=phtml(true);$("opts").innerHTML=q.options.map((o,i)=>`<button class="option ${res?(i===q.answer?'correct':mine?.choice===i?'wrong':''):''}" ${mine?'disabled':''} data-i="${i}">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join("");$("opts").querySelectorAll("button").forEach(b=>b.onclick=()=>answer(+b.dataset.i));$("count").textContent=`${Object.keys(room.answers||{}).length}/3 Antworten`;$("msg").textContent=mine?"✅ Antwort gespeichert. Warte auf die anderen …":"Wähle deine Antwort.";if(res){$("rr").classList.remove("hidden");$("rr").innerHTML=`<b>Richtig: ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</b>`+Object.entries(res).map(([id,r])=>`<div class="round">${r.correct?(r.place===1?'🥇':r.place===2?'🥈':'🥉'):'❌'} ${esc(room.players[id].name)}: +${r.points}</div>`).join("")}else $("rr").classList.add("hidden");$("next").classList.toggle("hidden",!room.players[pid].host||!room.scored);$("next").textContent=room.current===19?"Ergebnis":"Nächste Frage"}
