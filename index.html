function shuffle(a){
const b=[...a];
 
for(let i=b.length-1;i;i--)
const j=Math.floor(Math.random()*(i+1));
[b[i],b[j]]=[b[j],b[i]];
}
 
return b;
}
 
/*
13
Feste Antwortreihenfolgen:

Jede Frage erhält anhand ihrer festen Nummer eine bestimmte
Reihenfolge. Dadurch sehen alle Geräte dieselben Antworten
an denselben Positionen A, B, C und D.
 
Math.random() wird hier absichtlich NICHT verwendet.
*/
const ANSWER_ORDERS = [

[0,1,2,3],
[1,3,0,2],
[2,0,3,1],
[3,2,1,0],
[0,2,1,3],
[1,0,3,2],
[2,3,0,1],
[3,1,2,0]
];
const BANK=[];let id=1;const stems= term => `Welche Aussage zu „${term}“ ist richtig?`,
term => `Was beschreibt „${term}“ am besten?`,
term => `Welche Zuordnung zu „${term}“ stimmt?`
];
 
for(const [
conceptIndex,
[term, correct, wrong, explanation, topic]
] of concepts.entries()){
 
for(const [stemIndex, stem] of stems.entries()){
 
/*
Ausgangsreihenfolge:
Position 0 = richtige Antwort
Position 1 bis 3 = falsche Antworten
*/
const sourceOptions = [
correct,
...wrong
];
 
/*
Für jede Frage wird reproduzierbar dieselbe Reihenfolge gewählt.
*/
const orderIndex =
(conceptIndex * stems.length + stemIndex)
% ANSWER_ORDERS.length;
 
const selectedOrder =
ANSWER_ORDERS[orderIndex];
 
const options =
selectedOrder.map(
sourceIndex => sourceOptions[sourceIndex]
);
 
BANK.push({
id: id++,
q: stem(term),
options: options,
answer: options.indexOf(correct),
explanation: explanation,
topic: topic
});
}
}

let myId=localStorage.getItem("lf03PlayerId")||crypto.randomUUID();localStorage.setItem("lf03PlayerId",myId);let myName="",room=null,lastStatus="",scoring=false;

async function submitAnswer(choice){if(!room||room.status!=="playing"||room.answers?.[myId])return;const qid=room.questionIds[room.currentIndex];await set(ref(db,`rooms/${ROOM}/answers/${myId}`),{choice,questionId:qid,answeredAt:serverTimestamp()})}
async function scoreRound(){if(scoring||!room||!room.players?.[myId]?.host||room.roundScored)return;const pids=Object.keys(room.players||{}),answers=room.answers||{};if(pids.some(id=>!answers[id]))return;scoring=true;try{await runTransaction(roomRef,state=>{if(!state||state.roundScored)return state;const ids=Object.keys(state.players||{});if(ids.some(id=>!state.answers?.[id]))return state;const q=BANK.find(x=>x.id===state.questionIds[state.currentIndex]);const correct=ids.filter(pid=>state.answers[pid].choice===q.answer).sort((a,b)=>(state.answers[a].answeredAt||9e15)-(state.answers[b].answeredAt||9e15));const awards=[12,10,7],result={};ids.forEach(pid=>result[pid]={correct:false,points:0,place:null});correct.forEach((pid,i)=>{result[pid]={correct:true,points:awards[i]||7,place:i+1};state.players[pid].score=(state.players[pid].score||0)+(awards[i]||7)});state.roundResult=result;state.roundScored=true;return state})}finally{scoring=false}}
async function nextQuestion(){if(!room?.players?.[myId]?.host||!room.roundScored)return;if(room.currentIndex>=19){await update(roomRef,{status:"finished",finishedAt:serverTimestamp()});return}await update(roomRef,{currentIndex:room.currentIndex+1,answers:null,roundResult:null,roundScored:false})}
async function resetLobby(){if(!room?.players?.[myId]?.host)return;const reset={};for(const [pid,p] of Object.entries(room.players||{}))reset[pid]={...p,score:0};await update(roomRef,{status:"lobby",questionIds:null,currentIndex:0,answers:null,roundResult:null,roundScored:false,players:reset})}
function playersHtml(showAnswer=false){return Object.entries(room?.players||{}).map(([pid,p])=>`<div class="player ${pid===myId?'me':''} ${showAnswer&&room.answers?.[pid]?'done':''}"><b>${esc(p.name)} ${p.host?'👑':''}</b><div class="score">${p.score||0} Punkte</div><div class="small">${p.online===false?'offline':showAnswer?(room.answers?.[pid]?'Antwort abgegeben':'überlegt …'):'verbunden'}</div></div>`).join("")}
function render(){if(!room)return;const me=room.players?.[myId];if(!me){show("joinView");$("joinBtn").disabled=false;return}myName=me.name;if(room.status==="lobby"){show("lobbyView");$("lobbyPlayers").innerHTML=playersHtml();const count=Object.keys(room.players||{}).length;$("lobbyStatus").textContent=`${count} von 3 Spielern verbunden. ${count===3?'Bereit zum Start!':'Warte auf weitere Spieler …'}`;$("startBtn").classList.toggle("hidden",!me.host||count!==3);$("resetBtn").classList.toggle("hidden",!me.host)}else if(room.status==="playing"){show("gameView");renderGame();if(me.host)scoreRound()}else if(room.status==="finished"){show("finalView");const sorted=Object.values(room.players||{}).sort((a,b)=>(b.score||0)-(a.score||0));const medals=["🥇","🥈","🥉"];$("ranking").innerHTML=sorted.map((p,i)=>`<div class="rank ${i===0?'winner':''}">${medals[i]} <b>${esc(p.name)}</b> · ${p.score||0} Punkte</div>`).join("");$("newGameBtn").classList.toggle("hidden",!me.host)}}
function renderGame(){const qid=room.questionIds?.[room.currentIndex],q=BANK.find(x=>x.id===qid);if(!q)return;$("topic").textContent=q.topic;$("counter").textContent=`Frage ${room.currentIndex+1} von 20`;$("bar").style.width=`${(room.currentIndex+1)/20*100}%`;$("question").textContent=q.q;$("gamePlayers").innerHTML=playersHtml(true);const mine=room.answers?.[myId],result=room.roundResult;$("options").innerHTML=q.options.map((o,i)=>`<button class="option ${mine?.choice===i?'selected':''} ${result?(i===q.answer?'correct':mine?.choice===i?'wrong':''):''}" ${mine||result?'disabled':''} data-i="${i}">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join("");$("options").querySelectorAll("button").forEach(b=>b.onclick=()=>submitAnswer(Number(b.dataset.i)));const have=Object.keys(room.answers||{}).length,total=Object.keys(room.players||{}).length;$("waiting").textContent=`${have}/${total} Antworten`;$("answerStatus").textContent=mine?"✅ Antwort gespeichert. Warte auf die anderen …":"Wähle jetzt deine Antwort.";if(result){const rows=Object.entries(result).sort((a,b)=>(a[1].place||99)-(b[1].place||99));$("roundResult").innerHTML=`<b>Richtige Antwort: ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</b><br><span class="small">${esc(q.explanation)}</span>`+rows.map(([pid,r])=>`<div class="roundrow">${r.correct?(r.place===1?'🥇':r.place===2?'🥈':'🥉'):'❌'} ${esc(room.players[pid].name)}: +${r.points} Punkte</div>`).join("");$("roundResult").classList.remove("hidden")}else $("roundResult").classList.add("hidden");$("nextBtn").classList.toggle("hidden",!room.players[myId].host||!room.roundScored);$("nextBtn").textContent=room.currentIndex>=19?"Ergebnis anzeigen":"Nächste Frage"}
onValue(roomRef,s=>{room=s.val();render()});
</script></body></html>
