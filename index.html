<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LF03 Duell 4.0</title><style>
:root{--g:#25d48a;--p:#8b5cf6;--k:#ec4899;--bg:#07111f;--t:#eef6ff;--m:#9fb0c5;--r:#ef4444}*{box-sizing:border-box}body{margin:0;min-height:100vh;font:16px Segoe UI,Arial;background:radial-gradient(circle at top,#1b3156,var(--bg) 58%);color:var(--t)}main{max-width:980px;margin:auto;padding:16px}header{text-align:center;padding:18px}h1{font-size:clamp(2rem,6vw,4rem);margin:.1em;background:linear-gradient(90deg,var(--g),var(--p),var(--k));-webkit-background-clip:text;color:transparent}.panel{background:#111f34f2;border:1px solid #304968;border-radius:24px;padding:24px}.hidden{display:none!important}.small{color:var(--m)}input,select{width:100%;padding:14px;border:1px solid #43617f;border-radius:12px;background:#081524;color:white;margin:5px 0 10px}.btn{border:0;border-radius:13px;padding:13px 19px;font-weight:900;cursor:pointer;margin:10px 6px 0 0}.pri{background:linear-gradient(90deg,var(--g),var(--p));color:#04101b}.sec{background:#29415e;color:white}.danger{background:#7f1d1d;color:white}.status{margin-top:14px;padding:13px;border-radius:12px;background:#0a1728}.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:16px 0}.player{background:#0a1728;border:2px solid #2d4664;border-radius:15px;padding:13px}.me{border-color:var(--p)}.done{border-color:var(--g)}.score{font-size:1.3rem;font-weight:900}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.topic{background:var(--g);color:#06111d;padding:6px 10px;border-radius:99px;font-weight:900}.progress{height:10px;background:#263d58;border-radius:99px;overflow:hidden;margin:15px 0}.bar{height:100%;background:linear-gradient(90deg,var(--g),var(--k))}.question{font-size:1.4rem;margin:20px 0}.options{display:grid;gap:10px}.option{padding:15px;text-align:left;border:1px solid #405b7b;border-radius:14px;background:#172a43;color:white;font-size:1rem}.correct{background:#123d31;border-color:var(--g)}.wrong{background:#4b1c28;border-color:var(--r)}.round,.rank{padding:12px;margin:8px 0;border-radius:12px;background:#14253b}@media(max-width:700px){.players{grid-template-columns:1fr}.panel{padding:17px}}</style></head><body><main><header><h1>🎮 LF03 DUELL 4.0</h1><p class="small">2, 3, 4 oder 6 Spieler · 20 Zufallsfragen · 150 Fragen</p></header>
<section id="join" class="panel"><h2>Lobby beitreten</h2><p>Raumcode: <b>123456</b></p><label><b>Gewünschte Spielerzahl</b></label><select id="size"><option value="2">2 Spieler</option><option value="3" selected>3 Spieler</option><option value="4">4 Spieler</option><option value="6">6 Spieler</option></select><input id="name" maxlength="18" placeholder="Dein Spielername"><button id="joinBtn" class="btn pri">Beitreten</button><button id="forceReset" class="btn danger">Raum komplett leeren</button><div id="joinMsg" class="status">Noch nicht verbunden.</div></section>

<script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";import{getDatabase,ref,set,update,onValue,runTransaction,serverTimestamp,onDisconnect,remove}from"https://www.gstatic.com/firebasejs/10.13.1/firebase-database.js";

const DATA=[["OSI-Modell","strukturiert Netzwerkkommunikation in sieben Schichten","OSI & Grundlagen"],["Physical Layer","überträgt Bits als elektrische, optische oder Funksignale","OSI & Grundlagen"],["Data Link Layer","verarbeitet Frames und lokale MAC-Adressen","OSI & Grundlagen"],["Network Layer","übernimmt logische Adressierung und Routing","OSI & Grundlagen"],["Transport Layer","stellt Ende-zu-Ende-Transport über Ports bereit","OSI & Grundlagen"],["Switch","leitet Frames anhand von MAC-Adressen weiter","OSI & Grundlagen"],["Router","verbindet unterschiedliche IP-Netze miteinander","OSI & Grundlagen"],["Stern-Topologie","verbindet alle Endgeräte mit einem zentralen Gerät","Topologien & Verkabelung"],["Complete-Mesh","verbindet jeden Knoten direkt mit jedem anderen","Topologien & Verkabelung"],["Primärverkabelung","verbindet Gebäude innerhalb eines Standorts","Topologien & Verkabelung"],["Sekundärverkabelung","verbindet Gebäude- und Etagenverteiler","Topologien & Verkabelung"],["Tertiärverkabelung","führt auf der Etage bis zu den Anschlussdosen","Topologien & Verkabelung"],["Vollduplex","ermöglicht gleichzeitiges Senden und Empfangen","Ethernet & Übertragung"],["CSMA/CD","erkennt Kollisionen im geteilten Halbduplex-Ethernet","Ethernet & Übertragung"],["MAC-Adresse","kennzeichnet eine Netzwerkschnittstelle auf Schicht 2","Ethernet & Übertragung"],["Ethernet-Präambel","synchronisiert den Empfänger vor einem Ethernet-Frame","Ethernet & Übertragung"],["FCS","erkennt Übertragungsfehler in einem Ethernet-Frame","Ethernet & Übertragung"],["IPv4","verwendet logische Adressen mit einer Länge von 32 Bit","IP & Routing"],["IPv6","verwendet logische Adressen mit einer Länge von 128 Bit","IP & Routing"],["Subnetzmaske","trennt bei IPv4 den Netzanteil vom Hostanteil","IP & Routing"],["Standardgateway","leitet Pakete an Ziele außerhalb des lokalen Netzes","IP & Routing"],["TTL","begrenzt die Weiterleitung eines IP-Pakets in Hops","IP & Routing"],["ARP","ordnet im lokalen IPv4-Netz IP- und MAC-Adressen zu","IP & Routing"],["Unicast","sendet Daten gezielt an einen einzelnen Empfänger","IP & Routing"],["Broadcast","sendet Daten an alle Geräte der Broadcast-Domäne","IP & Routing"],["NAT","übersetzt IP-Adressen beim Übergang zwischen Netzen","IP & Routing"],["PAT","unterscheidet übersetzte Verbindungen über Portnummern","IP & Routing"],["DHCP","vergibt automatisch IP-Konfigurationen an Clients","Dienste & Diagnose"],["DORA","beschreibt Discover, Offer, Request und Acknowledge","Dienste & Diagnose"],["APIPA","verwendet bei IPv4 den Bereich 169.254.0.0/16","Dienste & Diagnose"],["DNS","übersetzt lesbare Namen in passende IP-Adressen","Dienste & Diagnose"],["ipconfig /all","zeigt die ausführliche IP-Konfiguration unter Windows","Dienste & Diagnose"],["TCP","überträgt Daten verbindungsorientiert und bestätigt","Dienste & Diagnose"],["UDP","überträgt Daten verbindungslos mit wenig Overhead","Dienste & Diagnose"],["VLAN","trennt ein Switch-Netz in logische Broadcast-Domänen","VLAN, WLAN & PoE"],["802.1Q","kennzeichnet die VLAN-Zugehörigkeit in Ethernet-Frames","VLAN, WLAN & PoE"],["Access-Port","transportiert normalerweise ein VLAN ohne VLAN-Tag","VLAN, WLAN & PoE"],["Trunk-Port","transportiert mehrere VLANs zwischen Netzwerkgeräten","VLAN, WLAN & PoE"],["PoE","überträgt Daten und elektrische Leistung über Ethernet","VLAN, WLAN & PoE"],["WPA3","schützt drahtlose Netzwerke mit moderner Verschlüsselung","VLAN, WLAN & PoE"],["VPN Site-to-Site","verbindet zwei Standortnetze über einen geschützten Tunnel","Security & Cloud"],["Firewall","filtert Netzwerkverbindungen anhand festgelegter Regeln","Security & Cloud"],["SaaS","stellt eine fertige Anwendung als Cloud-Dienst bereit","Security & Cloud"],["IaaS","stellt virtuelle Rechen-, Speicher- und Netzressourcen bereit","Security & Cloud"],["RAID 0","verteilt Daten ohne Redundanz auf mehrere Laufwerke","RAID & Backup"],["RAID 1","spiegelt Daten redundant auf mindestens zwei Laufwerke","RAID & Backup"],["RAID 5","verteilt Daten und Parität auf mindestens drei Laufwerke","RAID & Backup"],["Inkrementelles Backup","sichert Änderungen seit der letzten Sicherung","RAID & Backup"],["Online-USV / VFI","versorgt die Last dauerhaft ohne Umschaltzeit","Verfügbarkeit"],["Load Balancer","verteilt Anfragen auf mehrere Backend-Systeme","Verfügbarkeit"]],ORD=[[0,1,2,3],[1,3,0,2],[2,0,3,1],[3,2,1,0],[0,2,1,3],[1,0,3,2],[2,3,0,1],[3,1,2,0]],ST=[t=>`Welche Aussage zu „${t}“ ist richtig?`,t=>`Was beschreibt „${t}“ am besten?`,t=>`Welche Zuordnung zu „${t}“ stimmt?`];function buildBank(){const topics=new Map,all=DATA.map(x=>x[1]);DATA.forEach(x=>{if(!topics.has(x[2]))topics.set(x[2],[]);topics.get(x[2]).push(x[1])});let b=[],id=1;DATA.forEach((c,ci)=>ST.forEach((st,si)=>{let correct=c[1],same=(topics.get(c[2])||[]).filter(x=>x!==correct),pool=[...same,...all.filter(x=>x!==correct&&!same.includes(x))].sort((a,z)=>Math.abs(a.length-correct.length)-Math.abs(z.length-correct.length)),src=[correct,...pool.slice(0,3)],o=ORD[(ci*3+si)%ORD.length],opts=o.map(i=>src[i]);b.push({id:id++,q:st(c[0]),options:opts,answer:opts.indexOf(correct),explanation:`${correct}.`,topic:c[2]})}));return b}const BANK=buildBank();
const app=initializeApp(cfg),db=getDatabase(app),ROOM="123456",VERSION=5,ALLOWED=[2,3,4,6],STALE=45000,R=ref(db,`rooms/${ROOM}`);let key="",cid=crypto.randomUUID(),room=null,scoring=false,disconnectHandle=null,heartbeat=null,cleaning=false;const $=x=>document.getElementById(x),views=["join","lobby","game","final"],show=x=>views.forEach(v=>$(v).classList.toggle("hidden",v!==x)),esc=s=>String(s??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c])),slug=s=>s.trim().toLowerCase().replace(/[.#$\[\]/]/g,"-").replace(/\s+/g,"-").slice(0,40),shuffle=a=>{let b=[...a];for(let i=b.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
function activeKeys(s,now=Date.now()){return Object.keys(s?.players||{}).filter(k=>Object.values(s.players[k].connections||{}).some(c=>now-Number(c.lastSeen||0)<STALE))}function normalize(s,now=Date.now()){if(!s||s.version!==VERSION)return s;for(const[k,p]of Object.entries(s.players||{})){for(const[id,c]of Object.entries(p.connections||{}))if(now-Number(c.lastSeen||0)>=STALE)delete p.connections[id];if(!Object.keys(p.connections||{}).length)delete s.players[k]}let a=activeKeys(s,now);if(a.length){let hosts=a.filter(k=>s.players[k].host);if(hosts.length!==1){a.forEach(k=>s.players[k].host=false);a.sort((x,y)=>(s.players[x].joinedAt||0)-(s.players[y].joinedAt||0)||x.localeCompare(y));s.players[a[0]].host=true}}return s}
$("name").value=localStorage.getItem("lf03name-v5")||"";$("size").value=localStorage.getItem("lf03size-v5")||"3";$("joinBtn").onclick=join;$("leave").onclick=leave;$("start").onclick=startGame;$("next").onclick=next;$("again").onclick=newLobby;$("reset").onclick=forceReset;$("forceReset").onclick=forceReset;
async function join(){let name=$("name").value.trim().slice(0,18),chosen=Number($("size").value);if(!name)return alert("Bitte Namen eingeben.");key=slug(name);let C=ref(db,`rooms/${ROOM}/players/${key}/connections/${cid}`);disconnectHandle=onDisconnect(C);await disconnectHandle.remove();let now=Date.now(),res=await runTransaction(R,s=>{if(!s||s.version!==VERSION)s={version:VERSION,status:"lobby",maxPlayers:chosen,players:{}};s=normalize(s,now);s.players=s.players||{};s.maxPlayers=ALLOWED.includes(Number(s.maxPlayers))?Number(s.maxPlayers):chosen;let existing=s.players[key],active=activeKeys(s,now);if(!existing&&active.length>=s.maxPlayers)return;s.players[key]=existing||{name,score:0,host:active.length===0,joinedAt:now,connections:{}};s.players[key].name=name;s.players[key].connections=s.players[key].connections||{};s.players[key].connections[cid]={lastSeen:now};return normalize(s,now)});if(!res.committed){await disconnectHandle.cancel();$("joinMsg").textContent="Raum voll. Verwende deinen bisherigen Namen oder leere den Raum.";return}localStorage.setItem("lf03name-v5",name);localStorage.setItem("lf03size-v5",String(chosen));heartbeat=setInterval(()=>update(C,{lastSeen:serverTimestamp()}),10000)}
async function cleanup(){if(cleaning)return;cleaning=true;try{await runTransaction(R,s=>normalize(s,Date.now()))}finally{cleaning=false}}setInterval(()=>{if(key)cleanup()},12000);

function active(){return activeKeys(room)}async function startGame(){let a=active();if(!room.players[key]?.host||a.length!==Number(room.maxPlayers))return;let qs=shuffle(BANK).slice(0,20),ps={};a.forEach(k=>ps[k]={...room.players[k],score:0});await update(R,{version:VERSION,status:"playing",questions:qs,current:0,answers:null,result:null,scored:false,participants:a,players:ps})}async function answer(i){if(!room.answers?.[key])await set(ref(db,`rooms/${ROOM}/answers/${key}`),{choice:i,at:serverTimestamp()})}
async function score(){if(scoring||!room.players[key]?.host||room.scored)return;let ids=(room.participants||active()).filter(k=>room.players[k]),a=room.answers||{};if(ids.some(x=>!a[x]))return;scoring=true;try{await runTransaction(R,s=>{s=normalize(s,Date.now());if(!s||s.scored)return s;let ids=(s.participants||activeKeys(s)).filter(k=>s.players[k]);if(ids.some(x=>!s.answers?.[x]))return s;let q=s.questions[s.current],ok=ids.filter(x=>s.answers[x].choice===q.answer).sort((x,y)=>(s.answers[x].at||9e15)-(s.answers[y].at||9e15)),pts=[12,10,7,5,3,1],r={};ids.forEach(x=>r[x]={correct:false,points:0});ok.forEach((x,i)=>{r[x]={correct:true,points:pts[i],place:i+1};s.players[x].score=(s.players[x].score||0)+pts[i]});s.result=r;s.scored=true;return s})}finally{scoring=false}}async function next(){if(!room.players[key]?.host||!room.scored)return;if(room.current>=19)return update(R,{status:"finished"});await update(R,{current:room.current+1,answers:null,result:null,scored:false})}async function newLobby(){if(!room.players[key]?.host)return;let ps={};active().forEach(k=>ps[k]={...room.players[k],score:0});await update(R,{status:"lobby",questions:null,current:0,answers:null,result:null,scored:false,participants:null,players:ps})}
function phtml(ans=false){return active().map(k=>{let p=room.players[k];return`<div class="player ${k===key?'me':''} ${ans&&room.answers?.[k]?'done':''}"><b>${esc(p.name)} ${p.host?'👑':''}</b><div class="score">${p.score||0} Punkte</div><div class="small">${ans?(room.answers?.[k]?'Antwort abgegeben':'überlegt …'):'verbunden'}</div></div>`}).join("")}function render(){if(!room?.players?.[key]||!room.players[key].connections?.[cid])return show("join");let me=room.players[key],a=active();if(room.status==="lobby"){show("lobby");$("lp").innerHTML=phtml();let n=a.length,max=Number(room.maxPlayers||3);$("ls").textContent=`${n}/${max} Spieler. ${n===max?'Bereit!':'Warte auf Mitspieler …'}`;$("start").classList.toggle("hidden",!me.host||n!==max);$("reset").classList.toggle("hidden",!me.host)}else if(room.status==="playing"){show("game");renderGame();if(me.host)score()}else{show("final");let list=a.map(k=>room.players[k]).sort((x,y)=>(y.score||0)-(x.score||0)),m=["🥇","🥈","🥉","4.","5.","6."];$("ranking").innerHTML=list.map((p,i)=>`<div class="rank">${m[i]} <b>${esc(p.name)}</b> · ${p.score||0} Punkte</div>`).join("");$("again").classList.toggle("hidden",!me.host)}}function renderGame(){let q=room.questions?.[room.current];if(!q)return;let mine=room.answers?.[key],res=room.result;$("topic").textContent=q.topic;$("counter").textContent=`Frage ${room.current+1} von 20`;$("bar").style.width=`${(room.current+1)*5}%`;$("question").textContent=q.q;$("gp").innerHTML=phtml(true);$("opts").innerHTML=q.options.map((o,i)=>`<button class="option ${res?(i===q.answer?'correct':mine?.choice===i?'wrong':''):''}" ${mine?'disabled':''} data-i="${i}">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join("");$("opts").querySelectorAll("button").forEach(b=>b.onclick=()=>answer(+b.dataset.i));let need=(room.participants||active()).filter(k=>room.players[k]).length;$("count").textContent=`${Object.keys(room.answers||{}).length}/${need} Antworten`;$("msg").textContent=mine?"✅ Antwort gespeichert. Warte auf die anderen …":"Wähle deine Antwort.";if(res){$("rr").classList.remove("hidden");$("rr").innerHTML=`<b>Richtig: ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</b>`+Object.entries(res).map(([k,r])=>`<div class="round">${r.correct?(r.place===1?'🥇':r.place===2?'🥈':r.place===3?'🥉':r.place+'.'):'❌'} ${esc(room.players[k]?.name||k)}: +${r.points}</div>`).join("")}else $("rr").classList.add("hidden");$("next").classList.toggle("hidden",!room.players[key]?.host||!room.scored);$("next").textContent=room.current===19?"Ergebnis":"Nächste Frage"}onValue(R,s=>{room=s.val();render()});</script></body></html>
