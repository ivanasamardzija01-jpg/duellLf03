const app=initializeApp(cfg),db=getDatabase(app),ROOM="123456",VERSION=2,R=ref(db,`rooms/${ROOM}`);let key="",room=null,scoring=false,disconnectHandle=null;const $=x=>document.getElementById(x),views=["join","lobby","game","final"],show=x=>views.forEach(v=>$(v).classList.toggle("hidden",v!==x)),esc=s=>String(s??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c])),slug=s=>s.trim().toLowerCase().replace(/[.#$\[\]/]/g,"-").replace(/\s+/g,"-").slice(0,40),shuffle=a=>{let b=[...a];for(let i=b.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
$("name").value=localStorage.getItem("lf03name-v2")||"";$("joinBtn").onclick=join;$("leave").onclick=leave;$("start").onclick=startGame;$("next").onclick=next;$("again").onclick=newLobby;$("reset").onclick=forceReset;$("forceReset").onclick=forceReset;
async function join(){let name=$("name").value.trim().slice(0,18);if(!name)return alert("Bitte Namen eingeben.");key=slug(name);if(!key)return alert("Bitte einen anderen Namen wählen.");let P=ref(db,`rooms/${ROOM}/players/${key}`);disconnectHandle=onDisconnect(P);await disconnectHandle.remove();let result=await runTransaction(R,s=>{if(!s||s.version!==VERSION)s={version:VERSION,status:"lobby",players:{}};s.players=s.players||{};let existing=s.players[key],others=Object.keys(s.players).filter(k=>k!==key);if(!existing&&others.length>=3)return;let host=existing?.host||Object.keys(s.players).length===0;s.players[key]={name,score:existing?.score||0,host,joinedAt:Date.now()};return s});if(!result.committed){await disconnectHandle.cancel();$("joinMsg").textContent="Raum voll. Verwende deinen bisherigen Namen oder klicke auf „Raum 2.0 komplett leeren“.";return}localStorage.setItem("lf03name-v2",name)}
async function leave(){if(disconnectHandle)await disconnectHandle.cancel();if(key)await remove(ref(db,`rooms/${ROOM}/players/${key}`));show("join");room=null;key=""}
async function forceReset(){if(!confirm("Wirklich den ganzen Raum mit allen Spielern und dem Spielstand löschen?"))return;await remove(R);localStorage.removeItem("lf03name-v2");location.reload()}
async function startGame(){if(!room.players[key]?.host||Object.keys(room.players).length!==3)return;let qs=shuffle(BANK).slice(0,20),ps={};Object.entries(room.players).forEach(([k,p])=>ps[k]={...p,score:0});await update(R,{version:VERSION,status:"playing",questions:qs,current:0,answers:null,result:null,scored:false,players:ps})}
async function answer(i){if(room.answers?.[key])return;await set(ref(db,`rooms/${ROOM}/answers/${key}`),{choice:i,at:serverTimestamp()})}
async function score(){if(scoring||!room.players[key]?.host||room.scored)return;let ids=Object.keys(room.players),a=room.answers||{};if(ids.some(x=>!a[x]))return;scoring=true;try{await runTransaction(R,s=>{if(!s||s.scored)return s;let ids=Object.keys(s.players),q=s.questions[s.current],ok=ids.filter(x=>s.answers[x]?.choice===q.answer).sort((x,y)=>(s.answers[x].at||9e15)-(s.answers[y].at||9e15)),pts=[12,10,7],r={};ids.forEach(x=>r[x]={correct:false,points:0});ok.forEach((x,i)=>{r[x]={correct:true,points:pts[i],place:i+1};s.players[x].score=(s.players[x].score||0)+pts[i]});s.result=r;s.scored=true;return s})}finally{scoring=false}}
async function next(){if(!room.players[key]?.host||!room.scored)return;if(room.current>=19)return update(R,{status:"finished"});await update(R,{current:room.current+1,answers:null,result:null,scored:false})}
async function newLobby(){if(!room.players[key]?.host)return;let ps={};Object.entries(room.players).forEach(([k,p])=>ps[k]={...p,score:0});await update(R,{status:"lobby",questions:null,current:0,answers:null,result:null,scored:false,players:ps})}
function phtml(ans=false){return Object.entries(room.players||{}).map(([k,p])=>`<div class="player ${k===key?'me':''} ${ans&&room.answers?.[k]?'done':''}"><b>${esc(p.name)} ${p.host?'👑':''}</b><div class="score">${p.score||0} Punkte</div><div class="small">${ans?(room.answers?.[k]?'Antwort abgegeben':'überlegt …'):'verbunden'}</div></div>`).join("")}
function render(){if(!room?.players?.[key])return show("join");let me=room.players[key];if(room.status==="lobby"){show("lobby");$("lp").innerHTML=phtml();let n=Object.keys(room.players).length;$("ls").textContent=`${n}/3 Spieler. ${n===3?'Bereit!':'Warte auf Mitspieler …'}`;$("start").classList.toggle("hidden",!me.host||n!==3);$("reset").classList.toggle("hidden",!me.host)}else if(room.status==="playing"){show("game");renderGame();if(me.host)score()}else{show("final");let a=Object.values(room.players).sort((x,y)=>(y.score||0)-(x.score||0)),m=["🥇","🥈","🥉"];$("ranking").innerHTML=a.map((p,i)=>`<div class="rank">${m[i]} <b>${esc(p.name)}</b> · ${p.score||0} Punkte</div>`).join("");$("again").classList.toggle("hidden",!me.host)}}
function renderGame(){let q=room.questions?.[room.current];if(!q)return;let mine=room.answers?.[key],res=room.result;$("topic").textContent=q.topic;$("counter").textContent=`Frage ${room.current+1} von 20`;$("bar").style.width=`${(room.current+1)*5}%`;$("question").textContent=q.q;$("gp").innerHTML=phtml(true);$("opts").innerHTML=q.options.map((o,i)=>`<button class="option ${res?(i===q.answer?'correct':mine?.choice===i?'wrong':''):''}" ${mine?'disabled':''} data-i="${i}">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join("");$("opts").querySelectorAll("button").forEach(b=>b.onclick=()=>answer(+b.dataset.i));$("count").textContent=`${Object.keys(room.answers||{}).length}/3 Antworten`;$("msg").textContent=mine?"✅ Antwort gespeichert. Warte auf die anderen …":"Wähle deine Antwort.";if(res){$("rr").classList.remove("hidden");$("rr").innerHTML=`<b>Richtig: ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</b>`+Object.entries(res).map(([k,r])=>`<div class="round">${r.correct?(r.place===1?'🥇':r.place===2?'🥈':'🥉'):'❌'} ${esc(room.players[k].name)}: +${r.points}</div>`).join("")}else $("rr").classList.add("hidden");$("next").classList.toggle("hidden",!room.players[key]?.host||!room.scored);$("next").textContent=room.current===19?"Ergebnis":"Nächste Frage"}
onValue(R,s=>{room=s.val();render()});</script></body></html>
